<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本史 一問一答</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #f2f2f7; margin: 0; padding: 16px; color: #1c1c1e; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; font-size: 22px; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    select, button { width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: 1px solid #d1d1d6; box-sizing: border-box; }
    button { background: #007aff; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
    button:active { background: #0056b3; }
    .badge { display: inline-block; background: #e5e5ea; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; }
    .question { font-size: 18px; font-weight: bold; margin-bottom: 16px; }
    .answer { font-size: 18px; color: #34c759; font-weight: bold; margin-top: 12px; display: none; }
    .btn-secondary { background: #8e8e93; }
  </style>
</head>
<body>
  <div class="container">
    <h1>日本史 一問一答</h1>

    <!-- 設定画面 -->
    <div id="setupView">
      <div class="card">
        <label for="eraSelect">📚 時代選択</label>
        <select id="eraSelect"></select>
      </div>
      <button onclick="startQuiz()">テストスタート</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quizView" style="display:none;">
      <div class="card">
        <span class="badge" id="eraBadge">時代</span>
        <div class="question" id="qText">問題がここに表示されます</div>
        <button class="btn-secondary" id="ansBtn" onclick="showAnswer()">答えを見る</button>
        <div class="answer" id="aText">正解</div>
      </div>
      <button onclick="nextQuestion()">次の問題へ</button>
      <button class="btn-secondary" onclick="exitQuiz()" style="margin-top:8px;">TOPに戻る</button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      {"id": 1, "star": 3, "era": "原始", "question": "縄文時代の代表的な土器は？", "answer": "縄文土器"},
      {"id": 2, "star": 2, "era": "古墳", "question": "古墳時代に大王を中心とする政治連合を何という？", "answer": "ヤマト政権"},
      {"id": 3, "star": 1, "era": "飛鳥", "question": "冠位十二階を制定した人物は？", "answer": "聖徳太子"},
      {"id": 4, "star": 0, "era": "奈良", "question": "東大寺の大仏造立を進めた天皇は？", "answer": "聖武天皇"},
      {"id": 5, "star": 3, "era": "平安", "question": "『源氏物語』の作者は？", "answer": "紫式部"},
      {"id": 6, "star": 2, "era": "鎌倉", "question": "鎌倉幕府を開いた人物は？", "answer": "源頼朝"},
      {"id": 7, "star": 1, "era": "室町", "question": "室町幕府を開いた人物は？", "answer": "足利尊氏"},
      {"id": 8, "star": 0, "era": "安土桃山", "question": "楽市・楽座を行った人物として知られるのは？", "answer": "織田信長"},
      {"id": 9, "star": 3, "era": "江戸", "question": "江戸幕府を開いた人物は？", "answer": "徳川家康"},
      {"id": 10, "star": 2, "era": "江戸", "question": "大政奉還を行った将軍は？", "answer": "徳川慶喜"},
      {"id": 11, "star": 1, "era": "明治", "question": "1868年に出された政治方針を示す文書は？", "answer": "五箇条の御誓文"},
      {"id": 12, "star": 0, "era": "明治", "question": "日清戦争後、日本と清の間で結ばれた条約は？", "answer": "下関条約"},
      {"id": 13, "star": 3, "era": "大正", "question": "1918年に成立した本格的な政党内閣の首相は？", "answer": "原敬"},
      {"id": 14, "star": 2, "era": "昭和", "question": "日本国憲法が施行された年は？", "answer": "1947年"}
    ];

    let currentQuestions = [];
    let currentIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('eraSelect');
      const eras = [...new Set(QUESTIONS.map(q => q.era))];
      select.innerHTML = '<option value="ALL">すべて</option>';
      eras.forEach(era => {
        const opt = document.createElement('option');
        opt.value = era;
        opt.textContent = era;
        select.appendChild(opt);
      });
    });

    function startQuiz() {
      const selectedEra = document.getElementById('eraSelect').value;
      if (selectedEra === 'ALL') {
        currentQuestions = [...QUESTIONS];
      } else {
        currentQuestions = QUESTIONS.filter(q => q.era === selectedEra);
      }
      currentIndex = 0;
      document.getElementById('setupView').style.display = 'none';
      document.getElementById('quizView').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIndex >= currentQuestions.length) {
        alert('選択した時代の問題がすべて終了しました！');
        exitQuiz();
        return;
      }
      const q = currentQuestions[currentIndex];
      document.getElementById('eraBadge').textContent = q.era;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('aText').textContent = '答: ' + q.answer;
      document.getElementById('aText').style.display = 'none';
      document.getElementById('ansBtn').style.display = 'block';
    }

    function showAnswer() {
      document.getElementById('aText').style.display = 'block';
      document.getElementById('ansBtn').style.display = 'none';
    }

    function nextQuestion() {
      currentIndex++;
      loadQuestion();
    }

    function exitQuiz() {
      document.getElementById('setupView').style.display = 'block';
      document.getElementById('quizView').style.display = 'none';
    }
  </script>
</body>
</html>
